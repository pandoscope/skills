# https://github.com/DavidAnson/markdownlint-cli2
config:
  default: true
  MD013: false # line-length — agent docs use long URLs and table rows

globs:
  - "**/*.md"
  - "**/*.markdown"

# Skip git-ignored paths (e.g. _input/, _references/) since the hook now globs
# instead of receiving the tracked-file list from prek.
gitignore: true

ignores:
  - CHANGELOG.md
  - .copier-answers.agentic.yml
  - .all-contributorsrc
  - .agents/skills/**
  # Bridged agent skill dirs (symlinks into .agents/skills) — keep excludes in
  # sync so skill files aren't linted through the symlink.
  - .claude/skills/**
  # Verbatim upstream copy awaiting derivation. Upstream prose does not have to
  # satisfy our lint config, and the copy must stay byte-identical for the
  # derivation to read as a diff against what upstream published. Removed by
  # the derivation commit, which rewrites both files.
  - derived/writing-skills/SKILL.md
  - derived/writing-skills/GLOSSARY.md
