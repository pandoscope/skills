<script>
  (() => {
"use strict";
/**
 * View model — the single presentation authority for a grilling session.
 * Both projections (page.ts → interactive DOM in the artifact, text.ts →
 * markdown fallback) render from this structure, so their content cannot
 * diverge.
 *
 * DECISION:ARCH — presentation content is computed once here rather than
 * separately in the DOM and markdown renderers; the projections only lay
 * out ViewModel fields, they never derive wording from the raw session.
 */
/**
 * Rank-order-centroid weights for an ordered list of n items: the item at
 * 1-based rank i gets w_i = (1/n) * sum_{k=i..n} 1/k. The standard way to
 * turn a pure priority ordering into weights when the items carry no
 * scores of their own — earlier entries weigh more, later entries still
 * count, weights sum to 1.
 *
 * @param n - Number of ranked items.
 * @returns Weights indexed by rank-1.
 */
function rankOrderCentroid(n) {
    const weights = [];
    for (let i = 1; i <= n; i++) {
        let sum = 0;
        for (let k = i; k <= n; k++)
            sum += 1 / k;
        weights.push(sum / n);
    }
    return weights;
}
/**
 * Build the display form of a grilling session.
 *
 * @param session - A validated version-2 grilling session.
 * @returns The view model, with the free-text slot appended to every
 *   question so no renderer (or model) can forget it.
 */
function buildViewModel(session) {
    return {
        title: `Grilling S${session.session}`,
        questions: session.questions.map((q) => buildQuestion(q, session.session, session.preferences ?? [])),
        answerHint: 'Reply in chat with the answer id ("S1Q2A1" or just "1"), or "N, but actually because …" ("N, BAB …") to accept an option while overriding its stated reason. In the artifact page: click your answers, then use "Copy answers as JSON" and paste the result into chat.',
    };
}
/**
 * Build the display form of one question.
 *
 * @param q - The question.
 * @param session - The session number (for the S«s»Q«q» id).
 * @param preferences - The session's ordered preference names.
 * @returns The question view model.
 */
function buildQuestion(q, session, preferences) {
    const id = `S${session}Q${q.seq}`;
    const weights = rankOrderCentroid(preferences.length);
    const topWeight = weights[0] ?? 1;
    // Footnotes: one entry per preference matched by any option, ordered by
    // preference rank, anchored so entails prose can reference them.
    const matchedNames = [...new Set(q.options.flatMap((o) => o.matches ?? []))].sort((a, b) => preferences.indexOf(a) - preferences.indexOf(b));
    const footnotes = matchedNames.map((name, i) => {
        const rank = preferences.indexOf(name) + 1;
        return {
            marker: i + 1,
            anchorId: `${id}-pref-${i + 1}`,
            name,
            rank,
            weightPct: Math.round(weights[rank - 1] * 100),
            disposition: q.lineage.rulesConsidered.find((r) => r.name === name)?.disposition,
        };
    });
    // Raw score per listed option: matched preference weights plus the
    // agent's own term, capped by the top preference weight so agent
    // judgment can never outvote the user's highest-ranked preference.
    const raw = q.options.map((o) => (o.matches ?? []).reduce((sum, name) => sum + weights[preferences.indexOf(name)], 0) +
        (o.agentScore ?? 0) * topWeight);
    const total = raw.reduce((a, b) => a + b, 0);
    const options = q.options.map((option, i) => ({
        number: i + 1,
        id: `A${i + 1}`,
        label: option.label,
        badges: badgesFor(option.kind, q.lineage.cold, option.matches?.length ?? 0),
        ifClause: option.ifClause,
        entails: option.entails,
        footnotes: (option.matches ?? [])
            .map((name) => {
            const note = footnotes.find((f) => f.name === name);
            return { marker: note.marker, anchorId: note.anchorId };
        })
            .sort((a, b) => a.marker - b.marker),
        score: total > 0 && raw[i] > 0
            ? {
                pct: Math.round((raw[i] / total) * 100),
                breakdown: [
                    ...(option.matches ?? []).map((name) => ({
                        label: name,
                        pct: Math.round((weights[preferences.indexOf(name)] / total) * 100),
                    })),
                    ...(option.agentScore
                        ? [{ label: "my judgment", pct: Math.round(((option.agentScore * topWeight) / total) * 100) }]
                        : []),
                ],
            }
            : undefined,
        proposedPreferences: option.proposedPreferences ?? [],
        whyNotRecommended: option.whyNotRecommended,
    }));
    options.push({
        number: options.length + 1,
        id: `A${options.length + 1}`,
        label: "Free text",
        badges: [],
        entails: "custom choice or custom rejection reasoning",
        footnotes: [],
        proposedPreferences: [],
        freeText: true,
    });
    return {
        id,
        question: q.question,
        context: q.context,
        options,
        nearTieNote: q.nearTie
            ? `Near tie: options ${q.nearTie.slots.join("/")} roughly equivalent — differ on ${q.nearTie.differsOn}.`
            : undefined,
        lineage: {
            coldNote: q.lineage.cold ? "Cold: no active preference rule applies." : undefined,
            footnotes,
            rules: q.lineage.rulesConsidered
                .filter((rule) => !matchedNames.includes(rule.name))
                .map((rule) => ({ name: rule.name, disposition: rule.disposition })),
        },
        candidateReasons: q.options.flatMap((option, i) => (option.ifClause ? [{ slot: `A${i + 1}`, reason: option.ifClause }] : [])),
        answered: q.answer ? buildAnswered(q.answer, id, options) : undefined,
    };
}
/**
 * Build the display of a recorded answer.
 *
 * @param answer - The recorded answer state.
 * @param id - The question id, e.g. "S1Q1".
 * @param options - The question's option views, free-text slot included.
 * @returns The answered view.
 */
function buildAnswered(answer, id, options) {
    const disconfirmed = (answer.disconfirmedPreferences ?? []).map((name) => `Disconfirmed: ${name}`);
    if (answer.chosen === undefined) {
        return { line: `${id}: skipped`, rejected: [], disconfirmed };
    }
    const chosen = options[answer.chosen - 1];
    const ruling = chosen.freeText && answer.freeText ? answer.freeText : chosen.label;
    const correction = answer.correction ? ` — but actually because ${answer.correction}` : "";
    return {
        line: `${id}${chosen.id}: ${ruling}${correction}`,
        rejected: (answer.rejectionReasons ?? []).map((reason) => `Rejected: ${reason}`),
        disconfirmed,
    };
}
/**
 * Annotation texts for a slot kind — a merged usual-and-pick slot carries
 * both the prediction and the recommendation badge.
 *
 * @param kind - The slot kind from the decision question.
 * @param cold - Whether the question's recommendation is cold.
 * @param matchCount - Number of preferences the slot matches.
 * @returns The badge texts shown next to the option label.
 */
function badgesFor(kind, cold, matchCount) {
    const prediction = `prediction — matches ${matchCount} of your preferences`;
    if (kind === "usual")
        return [prediction];
    if (kind === "usual-and-pick")
        return [prediction, "recommendation — my pick"];
    if (kind === "pick")
        return [cold ? "recommendation — my pick (cold)" : "recommendation — my pick"];
    if (kind === "wildcard")
        return ["wildcard"];
    return [];
}

/**
 * Client-side renderer of the grilling artifact page. Runs inside the
 * pre-built template: reads the injected grilling-session JSON from the
 * data script tag and builds the interactive DOM from the view model —
 * next/previous navigation across questions, clickable answers whose
 * state persists while navigating, rejection-reason checkboxes, a
 * free-text box, a skip control, and a copy-answers-as-JSON export the
 * user pastes back into chat (and into decision memory).
 *
 * Compiled and inlined into template.html by build.ts — the template is
 * static; data arrives only as JSON, never as concatenated HTML.
 */
/**
 * Create an element with a class and optional text.
 *
 * @param tag - Element tag name.
 * @param className - CSS class to set.
 * @param text - Text content (set via textContent; data is never markup).
 * @returns The created element.
 */
function el(tag, className, text) {
    const node = document.createElement(tag);
    node.className = className;
    if (text !== undefined)
        node.textContent = text;
    return node;
}
/**
 * Append text that may carry `backtick` spans, rendering them as <code>.
 *
 * @param parent - Element to append into.
 * @param text - The text, with backticks delimiting verbatim rules.
 */
function appendWithInlineCode(parent, text) {
    text.split("`").forEach((part, i) => {
        if (i % 2 === 0) {
            parent.append(document.createTextNode(part));
        }
        else {
            const code = document.createElement("code");
            code.textContent = part;
            parent.append(code);
        }
    });
}
/** The whole interactive page: state, navigation, and rendering. */
class GrillingPage {
    /**
     * @param session - The injected grilling session.
     * @param root - Container element to render into.
     */
    constructor(session, root) {
        this.current = 0;
        this.session = session;
        this.vm = buildViewModel(session);
        this.root = root;
        this.answers = new Map(session.questions.flatMap((q) => (q.answer ? [[q.seq, { ...q.answer }]] : [])));
        const firstOpen = session.questions.findIndex((q) => !q.answer);
        this.current = firstOpen === -1 ? session.questions.length - 1 : firstOpen;
        this.render();
    }
    /** Answer state of the question at the current index, created lazily. */
    answerAt(index) {
        const seq = this.session.questions[index].seq;
        let state = this.answers.get(seq);
        if (!state) {
            state = {};
            this.answers.set(seq, state);
        }
        return state;
    }
    /** Re-render the whole page from state. */
    render() {
        this.root.replaceChildren();
        this.renderHeader();
        this.renderQuestion(this.vm.questions[this.current], this.answerAt(this.current));
        this.renderFooter();
    }
    /** Session title plus previous/next navigation. */
    renderHeader() {
        const header = el("header", "session-header");
        header.append(el("span", "session-title", this.vm.title));
        const nav = el("nav", "question-nav");
        const prev = el("button", "nav-button", "‹ Previous");
        prev.onclick = () => this.goto(this.current - 1);
        if (this.current === 0)
            prev.setAttribute("disabled", "");
        const next = el("button", "nav-button", "Next ›");
        next.onclick = () => this.goto(this.current + 1);
        if (this.current === this.vm.questions.length - 1)
            next.setAttribute("disabled", "");
        nav.append(prev, el("span", "nav-position", `${this.current + 1} / ${this.vm.questions.length}`), next);
        header.append(nav);
        this.root.append(header);
    }
    /**
     * Move to another question. State needs no saving here — every control
     * writes into the answers map as it is used.
     */
    goto(index) {
        this.current = Math.min(Math.max(index, 0), this.vm.questions.length - 1);
        this.render();
    }
    /** One question: options, why-block, skip, near-tie, lineage. */
    renderQuestion(q, state) {
        const header = el("div", "question-header");
        header.append(el("span", "question-seq", q.id + (state.skipped ? " — skipped" : "")));
        header.append(el("h1", "question-text", q.question));
        this.root.append(header);
        if (q.context) {
            const context = el("section", "context");
            context.append(el("h2", "section-heading", "Context"));
            context.append(el("p", "context-text", q.context));
            this.root.append(context);
        }
        const list = el("ol", "options");
        for (const option of q.options) {
            const item = el("li", "option" + (state.chosen === option.number ? " selected" : ""));
            item.onclick = () => {
                state.chosen = option.number;
                delete state.skipped;
                this.render();
            };
            const head = el("div", "option-head");
            head.append(el("span", "option-number", option.id));
            head.append(el("span", "option-label", option.label));
            for (const badge of option.badges)
                head.append(el("span", "option-badge", badge));
            if (option.score) {
                const chip = el("span", "option-score", `${option.score.pct}%`);
                // Hover reveals which contribution gave how much (title tooltip;
                // the breakdown is also in the markdown fallback verbatim).
                chip.title = option.score.breakdown.map((b) => `${b.label}: ${b.pct}%`).join("\n");
                head.append(chip);
            }
            item.append(head);
            if (option.ifClause)
                item.append(el("p", "option-if", `if ${option.ifClause}`));
            const entails = el("p", "option-entails");
            appendWithInlineCode(entails, option.entails);
            for (const note of option.footnotes) {
                const sup = document.createElement("sup");
                const link = document.createElement("a");
                link.href = `#${note.anchorId}`;
                link.textContent = `[${note.marker}]`;
                link.onclick = (e) => e.stopPropagation();
                sup.append(link);
                entails.append(" ", sup);
            }
            item.append(entails);
            for (const proposed of option.proposedPreferences) {
                item.append(el("p", "option-proposed", `proposed preference: ${proposed}`));
            }
            if (option.whyNotRecommended) {
                item.append(el("p", "option-why-not", `why not recommended: ${option.whyNotRecommended}`));
            }
            if (option.freeText && state.chosen === option.number) {
                const input = document.createElement("textarea");
                input.className = "free-text-input";
                input.placeholder = "Your choice or reasoning …";
                input.value = state.freeText ?? "";
                input.onclick = (e) => e.stopPropagation();
                input.oninput = () => {
                    state.freeText = input.value || undefined;
                };
                item.append(input);
            }
            list.append(item);
        }
        this.root.append(list);
        if (state.chosen !== undefined && state.chosen !== 1)
            this.renderWhyBlock(q, state);
        const controls = el("div", "question-controls");
        const skip = el("button", "skip-button", state.skipped ? "Skipped — undo" : "Skip this question");
        skip.onclick = () => {
            if (state.skipped) {
                delete state.skipped;
            }
            else {
                state.skipped = true;
                delete state.chosen;
            }
            this.render();
        };
        controls.append(skip);
        this.root.append(controls);
        if (q.nearTieNote)
            this.root.append(el("p", "near-tie", q.nearTieNote));
        const lineage = el("section", "lineage");
        lineage.append(el("h2", "section-heading", "Lineage"));
        if (q.lineage.coldNote)
            lineage.append(el("p", "lineage-cold", q.lineage.coldNote));
        const rules = el("ul", "lineage-rules");
        for (const note of q.lineage.footnotes) {
            const item = el("li", "lineage-rule");
            item.id = note.anchorId;
            item.append(el("span", "lineage-rule-marker", `[${note.marker}] `));
            item.append(el("span", "lineage-rule-name", note.name));
            item.append(el("span", "lineage-rule-weight", ` (rank ${note.rank}, weight ${note.weightPct}%)`));
            if (note.disposition)
                item.append(el("span", "lineage-rule-disposition", ` — ${note.disposition}`));
            item.append(this.disconfirmToggle(note.name, state));
            rules.append(item);
        }
        for (const rule of q.lineage.rules) {
            const item = el("li", "lineage-rule");
            item.append(el("span", "lineage-rule-name", rule.name));
            item.append(el("span", "lineage-rule-disposition", ` — ${rule.disposition}`));
            item.append(this.disconfirmToggle(rule.name, state));
            rules.append(item);
        }
        lineage.append(rules);
        this.root.append(lineage);
    }
    /**
     * "Not relevant here" toggle for a presented rule — records the rule as
     * disconfirmed: it counts as neither a win nor a loss in extraction.
     *
     * @param name - The preference name as presented.
     * @param state - The current question's answer state.
     * @returns The toggle element.
     */
    disconfirmToggle(name, state) {
        const label = el("label", "disconfirm-toggle");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = (state.disconfirmedPreferences ?? []).includes(name);
        box.onchange = () => {
            const names = new Set(state.disconfirmedPreferences ?? []);
            if (box.checked) {
                names.add(name);
            }
            else {
                names.delete(name);
            }
            state.disconfirmedPreferences = names.size ? [...names] : undefined;
        };
        label.append(box, el("span", "disconfirm-text", "not relevant here"));
        return label;
    }
    /**
     * Rejection-reason checkboxes plus the correction field — shown once
     * the selection diverges from slot 1 (the prediction/recommendation),
     * because that is when rejection reasons carry signal. Several reasons
     * may apply; each checked one is recorded verbatim.
     */
    renderWhyBlock(q, state) {
        const block = el("section", "why-block");
        block.append(el("h2", "section-heading", "Why not A1? (check all that apply)"));
        for (const candidate of q.candidateReasons) {
            const label = el("label", "why-reason");
            const box = document.createElement("input");
            box.type = "checkbox";
            box.checked = (state.rejectionReasons ?? []).includes(candidate.reason);
            box.onchange = () => {
                const reasons = new Set(state.rejectionReasons ?? []);
                if (box.checked) {
                    reasons.add(candidate.reason);
                }
                else {
                    reasons.delete(candidate.reason);
                }
                state.rejectionReasons = reasons.size ? [...reasons] : undefined;
            };
            label.append(box, el("span", "why-reason-text", `${candidate.slot}: ${candidate.reason}`));
            block.append(label);
        }
        const correction = document.createElement("input");
        correction.type = "text";
        correction.className = "correction-input";
        correction.placeholder = "but actually because … (overrides the stated reason)";
        correction.value = state.correction ?? "";
        correction.oninput = () => {
            state.correction = correction.value || undefined;
        };
        block.append(correction);
        this.root.append(block);
    }
    /** Copy-answers export plus the answer hint. */
    renderFooter() {
        const footer = el("footer", "session-footer");
        const copy = el("button", "copy-button", "Copy answers as JSON");
        const exportBox = document.createElement("textarea");
        exportBox.className = "export-box";
        exportBox.readOnly = true;
        exportBox.hidden = true;
        const note = el("p", "copy-note", "");
        note.hidden = true;
        copy.onclick = () => {
            const json = this.exportJson();
            exportBox.value = json;
            exportBox.hidden = false;
            navigator.clipboard.writeText(json).then(() => {
                note.textContent = "Copied — paste into chat (and decision memory).";
                note.hidden = false;
            }, () => {
                // Clipboard access can be blocked in the sandbox; the failure
                // must be observable, never a silent no-op.
                note.textContent = "Clipboard blocked here — copy from the box below.";
                note.hidden = false;
                exportBox.select();
            });
        };
        footer.append(copy, note, exportBox);
        footer.append(el("p", "answer-hint", this.vm.answerHint));
        this.root.append(footer);
    }
    /**
     * Serialize the answer state for pasting into chat / decision memory.
     *
     * @returns Pretty-printed JSON keyed by question id, e.g.
     *   {"session": 1, "answers": {"S1Q1": {"answer": "A3", ...}}}.
     */
    exportJson() {
        const answers = {};
        this.session.questions.forEach((q, i) => {
            const state = this.answers.get(q.seq);
            if (!state || (state.chosen === undefined && !state.skipped))
                return;
            const id = this.vm.questions[i].id;
            answers[id] = {
                ...(state.chosen !== undefined && { answer: `A${state.chosen}` }),
                ...(state.freeText && { freeText: state.freeText }),
                ...(state.rejectionReasons?.length && { rejectionReasons: state.rejectionReasons }),
                ...(state.correction && { correction: state.correction }),
                ...(state.disconfirmedPreferences?.length && { disconfirmedPreferences: state.disconfirmedPreferences }),
                ...(state.skipped && { skipped: true }),
            };
        });
        return JSON.stringify({ session: this.session.session, answers }, null, 2);
    }
}
const dataTag = document.getElementById("decision-context");
const rootNode = document.getElementById("app");
if (!dataTag || !rootNode) {
    throw new Error(`template is missing required nodes: decision-context=${!!dataTag}, app=${!!rootNode}`);
}
new GrillingPage(JSON.parse(dataTag.textContent ?? ""), rootNode);

})();
</script>
