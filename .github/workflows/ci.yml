name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Managed duplication: mirrors the prek job of the agentic-engineering-template
  # `lint.yml` (template-owned). This repo is still stamped from an old template
  # commit, so it cannot inherit that file yet — see #17. Drop this job in favour
  # of the rendered workflow when the repo adopts the current template.
  prek:
    name: "prek (all hooks, all files)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      # prek bootstraps hook runtimes (node for markdownlint, go for actionlint)
      # itself; uvx provides prek.
      - name: Run prek hooks
        run: uvx prek run --all-files --show-diff-on-failure

  # `prek run --all-files` only runs pre-commit-stage hooks, so the commitlint
  # hook (commit-msg stage) never fires there. Lint the PR's commit messages
  # explicitly against the same commitlint.config.mjs.
  commit-messages:
    name: "commitlint (PR commits)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: "22"

      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          npx --yes \
            --package @commitlint/cli \
            --package @commitlint/config-conventional \
            commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
